<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="masthead">
      <h1 class="masthead__title">Directory</h1>
      <div class="masthead__meta">
        <span id="count"></span>
      </div>
    </header>

    <div class="controls">
      <button id="load-btn" class="stamp-btn" type="button">Load Users</button>
      <div id="status" class="status" aria-live="polite"></div>
    </div>

    <section id="grid" class="grid" aria-label="User entries"></section>
  </div>

  <script src="script.js"></script>
</body>
</html>
